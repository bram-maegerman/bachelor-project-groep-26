<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/nav.css" />
    <link rel="stylesheet" href="style/settings.css" />
    <script src="js/script.js" defer></script>
    <script src="js/global.js" defer></script>
    <script src="js/settings.js" defer></script>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">
          <img src="assets/img/KULEUVEN_BIB_LOGO.png" alt="Logo" />
        </a>
        <div class="nav-wrapper">
          <button id="nav-dropdown">
            Instellingen <span id="nav-arrow">&#x25BC;</span>
          </button>
          <ul id="options" class="nav-options hidden">
            <li><a href="index.html">Startpagina</a></li>
            <li><a href="voorcontrole.html">Voorcontrole</a></li>
            <li><a href="run-overview.html">Laatste run</a></li>
            <li><a href="overview.html">Alle runs</a></li>
          </ul>
        </div>
      </nav>
    </header>
    <main>
      <div class="settings-container">
        <h2>Instellingen</h2>

        <div class="setting-item">
          <p>Export pad</p>

          <div class="export-path-row">
            <button onclick="chooseExportFolder()" aria-label="Kies exportmap">
              <img src="assets/img/edit-btn.svg" width="25" alt="Bewerken" />
            </button>
            <p id="export-path">Geen map geselecteerd</p>
          </div>
        </div>
        <div class="setting-item">
          <p>Logniveau</p>
          <select id="log-level" name="log-level">
            <option value="1">Alleen waarschuwingen</option>
            <option value="2">Waarschuwingen en info</option>
            <option value="3">Alle logs (waarschuwingen, info, succes)</option>
          </select>
        </div>
      </div>
    </main>
  </body>
