<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style/global.css" />
  <link rel="stylesheet" href="style/precheck.css" />
  <link rel="stylesheet" href="style/nav.css" />
  <script src="js/precheck.js" defer></script>
  <script src="js/global.js" defer></script>
</head>

<body>
  <header>
    <nav>
      <a href="homepage.html">
        <img src="assets/img/KULEUVEN_BIB_LOGO.png" alt="Logo" />
      </a>
      <div class="nav-wrapper">
        <button id="nav-dropdown">Precheck<span id="nav-arrow">&#x25BC;</span></button>
        <ul id="options" class="nav-options hidden">
          <li><a href="homepage.html">Home</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="last-run.html">Last run</a></li>
          <li><a href="all-runs.html">All runs</a></li>
          <li><a href="settings.html">Settings</a></li>
        </ul>
      </div>
    </nav>
  </header>
  <h1 class="title">Precheck</h1>
  <div class="center-container">
    <div class="left-container">
      <div class="project-wrapper">
        <button id="project-dropdown" class="project-dropdown-button">
          Select project<span id="project-arrow">&#x25BC;</span>
        </button>
        <ul id="project-options" class="project-options hidden"></ul>
      </div>

      <div class="drop-area" onclick="pickFile()">
        <p>Click here to upload file(s)</p>
      </div>
    </div>

    <div class="file-box">
      <h3>Selected files</h3>
      <div class="file-list-display" id="file-list"></div>
      <div class="file-actions">
        <span id="file-count">0/20</span>
        <button onclick="checkFiles()" class="check-btn">Check ></button>
      </div>
    </div>
  </div>

</body>

</html>
