<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style/global.css" />
  <link rel="stylesheet" href="style/nav.css" />
  <link rel="stylesheet" href="style/settings.css" />
  <script src="js/global.js" defer></script>
  <script src="js/settings.js" defer></script>
</head>

<body>
  <header>
    <nav>
      <a href="homepage.html">
        <img src="assets/img/KULEUVEN_BIB_LOGO.png" alt="Logo" />
      </a>
      <div class="nav-wrapper">
        <button id="nav-dropdown">
          Settings <span id="nav-arrow">&#x25BC;</span>
        </button>
        <ul id="options" class="nav-options hidden">
          <li><a href="homepage.html">Home</a></li>
          <li><a href="precheck.html">Precheck</a></li>
          <li><a href="last-run.html">Last run</a></li>
          <li><a href="all-runs.html">All runs</a></li>
        </ul>
      </div>
    </nav>
  </header>
  <main>
    <div class="settings-container">
      <h2>Settings</h2>

      <div class="setting-item">
        <div id="export-paths-list"></div>

        <div class="export-add-row">
          <div class="input-wrapper">
            <input type="text" class="input-field" id="new-export-name" placeholder="Name" />
          </div>

          <div class="input-wrapper">
            <input type="text" class="input-field with-button" id="selected-export-path" placeholder="Choose export path..." readonly />
            <button id="choose-new-export-folder" title="Select folder">📁</button>
          </div>
        </div>
        <button id="add-path-button">+</button>

      </div>

      <div class="setting-item">
        <p>Log level</p>
        <div class="options">
          <button class="option option-1" id="log-level-1">1</button>
          <button class="option option-2" id="log-level-2">2</button>
          <button class="option option-3" id="log-level-3">3</button>
        </div>
        <p class="option-description" id="log-level-description">
          Warnings and info messages are shown
        </p>
      </div>
      <div class="bottom-buttons">
        <button class="bottom save" id="save-button">Save</button>
        <button class="bottom reset" id="reset-button">Reset</button>
      </div>
    </div>
  </main>
</body>

</html>
