<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Live Output</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/nav.css" />
  </head>
  <body>
    <header>
      <img src="assets/img/KULEUVEN_BIB_LOGO.png" alt="Logo" />
      <button
        class="home-button"
        onclick="window.location.href='overview.html'"
      >
        Naar controle overzicht
      </button>
    </header>
    <div id="drop-area">
      <form class="my-form">
        <p>
          <strong>Sleep hier je bestanden naartoe</strong> of
          <label for="fileElem" class="button">klik om te bladeren</label>
        </p>
        <input
          type="file"
          id="fileElem"
          multiple
          accept=".pdf"
          onchange="handleFiles(this.files)"
        />
      </form>
    </div>

    <div id="file-list" class="file-list" style="margin-top: 15px"></div>
    <div id="file-section"></div>

    <script src="js/script.js"></script>
  </body>
</html>
