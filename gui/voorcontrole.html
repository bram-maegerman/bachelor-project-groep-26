<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Live Output</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/nav.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <header>
      <img src="assets/img/KULEUVEN_BIB_LOGO.png" alt="Logo" />
      <button
        class="home-button"
        onclick="window.location.href='overview.html'"
      >
        Naar controle overzicht
      </button>
    </header>

    <div class="center-container">
    <div class="drop-area">
      <p>
        <span onclick="pickFile()" style="color:#147FA1; text-decoration: underline; cursor: pointer;">Kies</span> of sleep bestanden naar hier om te uploaden
      </p>
    </div>

      <div class="file-box">
        <h3>Geselecteerde bestanden</h3>
        <div class="file-list-display" id="file-list"></div>
        <div class="file-actions">
          <span id="file-count">0/20</span>
          <button onclick="checkFiles()" class="check-btn">Controleer ></button>
        </div>
      </div>

      <div id="loader" class="loader hidden"></div>
    </div>

</body>

</html>
